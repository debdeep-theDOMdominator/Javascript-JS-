<body>
    <header>
        <h1>
            Ch L / Part IV : " Promise : Practice 2" in JS
        </h1>
    </header>

    <hr>

    <main>
        
    </main>
       
    <script>
        function call_promise_Function(){
            return new Promise(function(res,rej){
                setTimeout(()=>{
                    let num = Math.floor(Math.random() * 10);

                    if(num > 5){
                        res(`Resolved with : ${num}`);
                    }else{
                        rej(`Rejected with : ${num}`);
                    }
                },1000);
            });
        };
        

        setInterval(function(){
            call_promise_Function().then(function(res_val){
                console.log(res_val);
            }).catch(function(rej_val){
                console.log(rej_val);
            });
        },1000);

    </script>
    
</body>
