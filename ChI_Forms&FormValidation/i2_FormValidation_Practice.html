<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Registration Form</title>

    <style>

        /* =========================
           Global Styling
        ========================= */

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;

            font-family:Georgia, 'Times New Roman', Times, serif;
        }

        hr{
            border: 1px solid wheat;
        }

        body{
            margin: 50px;

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:
            linear-gradient(
                135deg,
                #001219,
                #005f73,
                #0a9396
            );

            overflow:auto;
        }

        /* =========================
           Background Glow
        ========================= */

        .bg-circle1,
        .bg-circle2{
            position:absolute;
            border-radius:50%;
            filter:blur(10px);
        }

        .bg-circle1{
            width:300px;
            height:300px;

            background:#ee9b00;

            top:-80px;
            left:-80px;

            opacity:0.4;
        }

        .bg-circle2{
            width:350px;
            height:350px;

            background:#bb3e03;

            bottom:-120px;
            right:-120px;

            opacity:0.35;
        }

        /* =========================
           Form Container
        ========================= */

        .form-container{

            width:750px;

            padding:35px;

            border-radius:25px;

            background:rgba(0,18,25,0.75);

            backdrop-filter:blur(14px);

            box-shadow:
            0 0 25px rgba(0,0,0,0.45);

            border:2px solid rgba(255,255,255,0.08);

            position:relative;
            z-index:10;
        }

        /* =========================
           Heading
        ========================= */

        h1{
            text-align:center;

            color:#ee9b00;

            margin-bottom:30px;

            letter-spacing:1px;

            text-shadow:
            0 0 10px rgba(238,155,0,0.4);
        }

        /* =========================
           Input Group
        ========================= */

        .input-group{
            margin-bottom:22px;
        }

        label{
            display:block;

            margin-bottom:8px;

            color:#94d2bd;

            font-size:18px;
        }

        /* =========================
           Inputs
        ========================= */

        input,
        textarea,
        select{

            width:100%;

            padding:14px;

            border:none;

            outline:none;

            border-radius:14px;

            background:#0a9396;

            color:#ffffff;

            font-size:17px;

            transition:0.3s;
        }

        textarea{
            resize:none;
            height:110px;
        }

        input:focus,
        textarea:focus,
        select:focus{

            transform:scale(1.02);

            background:#005f73;

            box-shadow:
            0 0 10px rgba(148,210,189,0.5);
        }

        /* =========================
           Placeholder
        ========================= */

        ::placeholder{
            color:#d9f0e8;
        }

        /* =========================
           Gender Section
        ========================= */

        .gender-box{

            display:flex;
            gap:20px;

            margin-top:10px;
        }

        .gender-box label{
            color:#e9d8a6;
            cursor:pointer;
        }

        .gender-box input{
            width:auto;
            margin-right:6px;
        }

        /* =========================
           Button
        ========================= */

        button{

            width:100%;

            padding:15px;

            border:none;

            border-radius:16px;

            font-size:19px;

            cursor:pointer;

            background:
            linear-gradient(
                135deg,
                #ee9b00,
                #ca6702
            );

            color:#001219;

            font-weight:bold;

            transition:0.35s;
        }

        button:hover{

            transform:translateY(-3px);

            background:
            linear-gradient(
                135deg,
                #ca6702,
                #bb3e03
            );

            color:white;

            box-shadow:
            0 0 18px rgba(202,103,2,0.45);
        }

        .ApplicationNumber{
            color: white;
            text-align: center;
            font-family:'Times New Roman', Times, serif;
        }

        /* =========================
           Error Message Area
        ========================= */

        .error{

            color:#ffb4a2;

            margin-top:6px;

            font-size:14px;
        }



    </style>

</head>

<body>

    <!-- Background Decorations -->

    <div class="bg-circle1"></div>
    <div class="bg-circle2"></div>

    <!-- Form -->

    <div class="form-container">

        <h1>
            User Registration
        </h1>

        <div class="Application">
            <hr><br>
                <h2 class="ApplicationNumber">
                    You are registrered with us now ! 
                    <br>
                    APPLICATION NUMBER : MVS/1256/2026-27/00001
                </h2>
            <br><hr><br>
        </div>

        <form id="registrationForm">

            <!-- Name -->

            <div class="input-group">

                <label for="name">
                    Full Name
                </label>

                <input 
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                >

                <div class="error" id="nameError">

                </div>

            </div>

            <!-- Age -->

            <div class="input-group">

                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    placeholder="Enter your age"
                >

                <div class="error" id="ageError"></div>

            </div>

            <!-- Gender -->

            <div class="input-group">

                <label>
                    Gender
                </label>

                <div class="gender-box">

                    <label>
                        <input type="radio" name="gender" value="Male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="Other">
                        Other
                    </label>

                </div>

                <div class="error" id="genderError"></div>

            </div>

            <!-- Email -->

            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                >

                <div class="error" id="emailError"></div>

            </div>

            <!-- Password -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                >

                <div class="error" id="passwordError"></div>

            </div>

            <!-- Re-enter your Password // DOuble Password Check ! -->

            <div class="input-group">

                <label for="Password02">
                    Re-enter your password !
                </label>

                <input
                    type="password"
                    id="password02"
                    placeholder="Enter password"
                >

                <div class="error" id="passwordError02"></div>

            </div>

            <!-- Address -->

            <div class="input-group">

                <label for="address">
                    Address
                </label>

                <textarea
                    id="address"
                    placeholder="Enter your address"
                ></textarea>

                <div class="error" id="addressError"></div>

            </div>

            

            <!-- Submit -->

            <button type="submit">
                Register
            </button>

        </form>

    </div>

    <script>
        
        let name = document.querySelector("#name");
        let age = document.querySelector("#age");
        let email = document.querySelector("#email");
        let password = document.querySelector("#password");
        let password02 = document.querySelector("#password02");
        let address = document.querySelector("#address");

        let registrationForm = document.querySelector("#registrationForm");

        registrationForm.addEventListener("submit",function(dets){
            dets.preventDefault();
            // console.log(password.value);
            // console.log(email.value);
            // console.log(name.value.length);

            DetailsChecker(dets);
            

        });

        function DetailsChecker(dets){
            
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            const passwordRegex =/^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$/;

            document.querySelector("#nameError").textContent="";
            document.querySelector("#ageError").textContent="";
            document.querySelector("#emailError").textContent="";

            // name CHECKER :
            if(name.value==""){
                document.querySelector("#nameError").textContent = "Enter your Name !";
            }else if(name.value.length<=2){
                document.querySelector("#nameError").textContent = "Length of name must be of 3 letters min.";
            }else{
                document.querySelector("#nameError").textContent="";
            }

            // age CHECKER :
            if(age.value ==""){
                document.querySelector("#ageError").textContent = "Enter your Age !";
            }else if(age.value<=17){
                document.querySelector("#ageError").textContent = "Must be atleast 18 yrs old , to register !";
            }else{
                document.querySelector("#ageError").textContent = "";
            }

            // email CHECKER :
            if(email.value == ""){
                document.querySelector("#emailError").textContent = "Enter your Email Address !";
            }else{
                const emailValid = emailRegex.test(email.value);
                if(emailValid===false){
                    document.querySelector("#emailError").textContent = "Enter a valid email address";
                    console.log(emailValid);
                }else{
                    document.querySelector("#emailError").textContent = "valid email";
                    setTimeout(function(){
                        document.querySelector("#emailError").textContent = "";
                    },2000);
                    console.log(emailValid);
                }
            };

            // password CHECKER : 
            if(password.value==""){
                document.querySelector("#passwordError").textContent = "Enter your Password !";
            }else{
                console.log(password.value);
                const passwordValid = passwordRegex.test(password.value);
                if(passwordValid==false){
                    document.querySelector("#passwordError").textContent = "Enter a valid Password";
                    console.log(passwordValid);
                }else{
                    document.querySelector("#passwordError").textContent = "valid Password";
                    setTimeout(function(){
                        document.querySelector("#passwordError").textContent = "";
                    },2000);
                    console.log(passwordValid);
                }
            }    

            //double Password Checker : 
            if(password02.value==""){
                document.querySelector("#passwordError").textContent = "Enter your Password !";
            }else{
                if(password02.value!=password.value){
                    document.querySelector("#passwordError02").textContent = "Enter the same Password";
                    console.log(password02.value);
                }else{
                    document.querySelector("#passwordError02").textContent = "Password matched ";
                    console.log(password02.value);
                    setTimeout(function(){
                        document.querySelector("#passwordError02").textContent = "";
                    },2000);
                }
            }

        };

    </script>

</body>
</html>
