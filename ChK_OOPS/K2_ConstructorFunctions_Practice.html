    <script>
        // Constructor function

        function Pencil(name,T_color,price,qt,company,customMsg){
            this.name = name;
            this.color = T_color;
            this.price = price ;
            this.quantity = qt;
            this.company=company;
            this.customMsg=customMsg;

            this.PencilWrite = function(){
                let h2 = document.createElement("h2");

                h2.style.color = T_color;
                if(customMsg){
                    h2.innerText = customMsg;
                }else{
                    h2.innerText = `I'm writing now ,with a  ${T_color} colour ${name} pencil`;
                }
                document.body.append(h2);
            };
        };
