        // Constructor function

            function Pencil(name,T_color,price,qt,company,customMsg){
                this.name = name;
                this.color = T_color;
                this.price = price ;
                this.quantity = qt;
                this.company=company;
                this.customMsg=customMsg;
            };

        //Prototype : 
            Pencil.prototype.PencilWrite = function(customMsg){
                    let h2 = document.createElement("h2");

                    h2.style.color = this.color;
                    if(this.customMsg){
                        h2.innerText = this.customMsg;
                    }else{
                        h2.innerText = `I'm writing now ,with a  ${this.color} colour ${this.name} pencil`;
                    }
                    document.body.append(h2);
                };
