    <script>
        let MsgSending_Icon_User01 = document.querySelector("#MsgSending_Icon_User01");

        // CLASS : 
            class User {
                constructor(name, age, UserName, Pswd, T_color) {
                    this.name = name;
                    this.age = age;
                    this.UserName = UserName;
                    this.Pswd = Pswd;
                    this.color = T_color;
                }

                User_Text_message(customMsg) {
                    let h2 = document.createElement("h2");
                    h2.classList.add("Messages");
                    h2.style.color = this.color;

                    h2.innerText = customMsg
                        ? `${this.name} : ${customMsg}`
                        : `${this.name} : ...`;

                    document.querySelector(".MsgBox").append(h2);
                }
            }
        //Inheritance : Child Class Inheriting from Parent class
                class Admin extends User{
                    constructor(name, age , UserName , Pswd , T_color){
                        super(name, age , UserName , Pswd , T_color); 
                        //this is initializing all values of Admin Class to that Parent's class constructor . As it is inheritated , so this class will also have those properties and functions .
                        this.role="Admin";
                    };

                    removeAllMsg(){
                        document.querySelectorAll("h2").forEach(function(element){
                            element.remove();
                        });
                        let h3= document.createElement("h3");
                        h3.textContent = "All message are cleared by admin";
                        // console.dir(h3);
                        h3.style.textAlign = "center";
                        document.querySelector(".MsgBox").append(h3);
                        setTimeout(function(){
                            document.querySelector("h3").remove();
                        },2000);
                    };
                };

        //setInterval : 
            setInterval(function(){
                let today = new Date();
                let hours = new Date().getHours();
                let minutes = new Date().getMinutes();
                let seconds = new Date().getSeconds();
                let day = today.getDate();
                let month = today.getMonth() + 1; // Months are zero-based

                day = String(day).padStart(2, '0');
                month = String(month).padStart(2, '0');
                let year = today.getFullYear();

                console.log(`${day}:${month}:${year} , ${hours} : ${minutes} : ${seconds}`);
                LiveClock.textContent = `${day}:${month}:${year} ::: ${hours} : ${minutes} : ${seconds}`;
